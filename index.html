<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MujaHeeBot Coding Quest - SD Muhammadiyah Al Mujahidin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a1f1c;
            --card-bg: #11352d;
            --panel-bg: #194d40;
            --accent-green: #10b981;
            --accent-yellow: #fbbf24;
            --text-light: #ecfdf5;
            --grid-border: rgba(16, 185, 129, 0.2);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .navbar-custom {
            background: linear-gradient(135deg, #0a332a, #051613);
            border-bottom: 3px solid var(--accent-green);
        }

        .school-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .badge-score {
            background: linear-gradient(45deg, #fbbf24, #f59e0b);
            color: #000;
            font-weight: 800;
            font-size: 1.1rem;
            border-radius: 20px;
            padding: 8px 18px;
        }

        .quest-card {
            background: linear-gradient(145deg, var(--card-bg), var(--panel-bg));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 20px;
        }

        .level-card {
            background-color: var(--card-bg);
            border: 1px solid var(--grid-border);
            border-radius: 8px;
            cursor: pointer;
        }

        .level-card.active {
            border: 2px solid var(--accent-yellow);
            background-color: var(--panel-bg);
        }

        /* GRID 8x8 */
        .grid-container {
            background-color: var(--bg-main);
            border: 2px solid var(--accent-green);
            border-radius: 12px;
            padding: 10px;
        }

        .grid-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }

        .grid-cell {
            aspect-ratio: 1;
            background-color: #0c2b24;
            border: 1px solid var(--grid-border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grid-cell.bot {
            background-color: #064e3b;
            border: 2px solid var(--accent-yellow);
        }

        .block-btn {
            color: white;
            border: none;
            padding: 10px 14px;
            margin: 4px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .code-area {
            background-color: var(--bg-main);
            border: 2px dashed var(--accent-green);
            border-radius: 10px;
            min-height: 100px;
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn-action {
            background: linear-gradient(45deg, #10b981, #059669);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 12px;
            border-radius: 10px;
        }

        /* Modal Custom Style */
        .modal-content {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-green);
            color: var(--text-light);
        }
    </style>
</head>
<body>

    <!-- Modal Login Siswa -->
    <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0 text-center d-block">
                    <img src="https://lh3.googleusercontent.com/d/1nBO66TKYu_Nzv4XckDaRZJGCqmbqjWS1" alt="Logo" class="school-logo mb-2">
                    <h4 class="modal-title fw-bold text-warning">MujaHeeBot Quest</h4>
                    <p class="text-muted small">SD Muhammadiyah Al Mujahidin</p>
                </div>
                <div class="modal-body">
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Lengkap Siswa</label>
                            <input type="text" id="studentName" class="form-control" placeholder="Contoh: Abro Arqom" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kelas / Paralel</label>
                            <select id="studentClass" class="form-select" required>
    <option value="">-- Pilih Kelas --</option>

    <!-- KELAS 1 -->
    <option value="1 Champion">1 Champion</option>
    <option value="1 Excellent">1 Excellent</option>
    <option value="1 Brilliant">1 Brilliant</option>
    <option value="1 Olimpiade">1 Olimpiade</option>
    <option value="1 Smart">1 Smart</option>

    <!-- KELAS 2 -->
    <option value="2 Champion">2 Champion</option>
    <option value="2 Excellent">2 Excellent</option>
    <option value="2 Brilliant">2 Brilliant</option>
    <option value="2 Olimpiade">2 Olimpiade</option>
    <option value="2 Smart">2 Smart</option>

    <!-- KELAS 3 -->
    <option value="3 Champion">3 Champion</option>
    <option value="3 Excellent">3 Excellent</option>
    <option value="3 Brilliant">3 Brilliant</option>
    <option value="3 Olimpiade">3 Olimpiade</option>
    <option value="3 Smart">3 Smart</option>

    <!-- KELAS 4 -->
    <option value="4 Champion">4 Champion</option>
    <option value="4 Excellent">4 Excellent</option>
    <option value="4 Brilliant">4 Brilliant</option>
    <option value="4 Olimpiade">4 Olimpiade</option>
    <option value="4 Smart">4 Smart</option>

    <!-- KELAS 5 -->
    <option value="5 Champion">5 Champion</option>
    <option value="5 Excellent">5 Excellent</option>
    <option value="5 Brilliant">5 Brilliant</option>
    <option value="5 Olimpiade">5 Olimpiade</option>
    <option value="5 Smart">5 Smart</option>

    <!-- KELAS 6 -->
    <option value="6 Champion">6 Champion</option>
    <option value="6 Excellent">6 Excellent</option>
    <option value="6 Brilliant">6 Brilliant</option>
    <option value="6 Olimpiade">6 Olimpiade</option>
    <option value="6 Smart">6 Smart</option>
</select>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">
                            <i class="fa-solid fa-gamepad me-2"></i> Mulai Petualangan!
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Header Navbar -->
    <nav class="navbar navbar-custom py-3 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <img src="https://lh3.googleusercontent.com/d/1nBO66TKYu_Nzv4XckDaRZJGCqmbqjWS1" alt="Logo" class="school-logo">
                <div>
                    <h5 class="m-0 fw-bold text-success">MujaHeeBot Quest</h5>
                    <small class="text-light opacity-75" id="userProfileDisplay">Siswa: -</small>
                </div>
            </div>
            <div>
                <span class="badge-score"><i class="fa-solid fa-star me-1"></i> Skor: <span id="scoreDisplay">0</span></span>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            
            <!-- Sidebar Level -->
            <div class="col-lg-3">
                <div class="quest-card">
                    <h6 class="fw-bold text-warning mb-3"><i class="fa-solid fa-map me-2"></i> Misi Petualangan</h6>
                    <div id="levelList" class="d-flex flex-column gap-2" style="max-height: 500px; overflow-y: auto;">
                        <!-- Generated By JS -->
                    </div>
                </div>
            </div>

            <!-- Workspace Game -->
            <div class="col-lg-9">
                <div class="row g-3">
                    <div class="col-md-7">
                        <div class="quest-card h-100">
                            <div class="d-flex justify-content-between mb-2">
                                <span id="badgeLevel" class="badge bg-warning text-dark fw-bold">Misi 1</span>
                                <span id="syncStatus" class="badge bg-secondary"><i class="fa-solid fa-cloud me-1"></i> Ready</span>
                            </div>
                            <h5 id="questTitle" class="fw-bold text-success mb-2">Langkah Pertama</h5>
                            <p id="questGoal" class="small text-light mb-3">Pandu robot ke tujuan!</p>

                            <!-- Grid 8x8 -->
                            <div class="grid-container">
                                <div id="gridBoard" class="grid-board"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-5">
                        <div class="quest-card h-100 d-flex flex-column">
                            <h6 class="fw-bold text-warning mb-2">Blok Perintah</h6>
                            <div class="mb-3">
                                <button class="block-btn bg-primary" onclick="addBlock('Maju 1')">+ Maju 1</button>
                                <button class="block-btn bg-secondary" onclick="addBlock('Belok Kanan')">+ Belok Kanan</button>
                                <button class="block-btn bg-secondary" onclick="addBlock('Belok Kiri')">+ Belok Kiri</button>
                                <button class="block-btn bg-danger" onclick="addBlock('Ambil Objek')">+ Ambil Objek</button>
                            </div>

                            <h6 class="fw-bold text-success mb-2">Program Logika</h6>
                            <div id="codeArea" class="code-area flex-grow-1 mb-3"></div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-action flex-grow-1" onclick="runCode()"><i class="fa-solid fa-play me-1"></i> JALANKAN</button>
                                <button class="btn btn-outline-danger" onclick="resetCode()"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // URL Google Apps Script yang sudah Anda deploy
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAgTb7-rZhXElqB9vkpqbvgizHqtbCzchKHYqEimZl2Syg4z5asD719BHLpZ3cbl2M/exec";

        let currentStudent = { nama: "", kelas: "" };
        let currentMisi = 1;
        let score = 0;
        let userSequence = [];

        // Tampilkan Modal Login saat pertama kali dibuka
        window.onload = () => {
            const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
            loginModal.show();
            renderLevelList();
            renderGrid();
        };

        function handleLogin(e) {
            e.preventDefault();
            currentStudent.nama = document.getElementById('studentName').value.trim();
            currentStudent.kelas = document.getElementById('studentClass').value;

            document.getElementById('userProfileDisplay').textContent = `Siswa: ${currentStudent.nama} (${currentStudent.kelas})`;
            
            const modalEl = document.getElementById('loginModal');
            const modalInstance = bootstrap.Modal.getInstance(modalEl);
            modalInstance.hide();

            // Kirim data awal ke Google Sheets
            syncToGoogleSheets();
        }

        // Fungsi Mengirim Data ke Google Sheets
        async function syncToGoogleSheets() {
            if (!GOOGLE_SCRIPT_URL) return;

            const syncBadge = document.getElementById('syncStatus');
            syncBadge.className = "badge bg-warning text-dark";
            syncBadge.innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> Menyimpan...`;

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nama: currentStudent.nama,
                        kelas: currentStudent.kelas,
                        misi: `Misi ${currentMisi}`,
                        skor: score
                    })
                });

                syncBadge.className = "badge bg-success";
                syncBadge.innerHTML = `<i class="fa-solid fa-check me-1"></i> Tersimpan`;
            } catch (err) {
                console.error("Gagal sinkronisasi:", err);
                syncBadge.className = "badge bg-danger";
                syncBadge.innerHTML = `<i class="fa-solid fa-xmark me-1"></i> Gagal Simpan`;
            }
        }

        function renderLevelList() {
            const container = document.getElementById('levelList');
            container.innerHTML = '';
            for(let i = 1; i <= 27; i++) {
                const card = document.createElement('div');
                card.className = `level-card p-2 ${i === 1 ? 'active' : ''}`;
                card.innerHTML = `<small class="fw-bold">Misi ${i}</small>`;
                container.appendChild(card);
            }
        }

        function renderGrid() {
            const board = document.getElementById('gridBoard');
            board.innerHTML = '';
            for(let i=0; i<64; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                if(i === 56) {
                    cell.classList.add('bot');
                    cell.innerHTML = '<i class="fa-solid fa-robot text-warning"></i>';
                } else if(i === 7) {
                    cell.innerHTML = '<i class="fa-solid fa-school text-info"></i>';
                }
                board.appendChild(cell);
            }
        }

        function addBlock(cmd) {
            userSequence.push(cmd);
            updateCodeDisplay();
        }

        function updateCodeDisplay() {
            const area = document.getElementById('codeArea');
            area.innerHTML = userSequence.map((c, i) => `<span class="badge bg-primary p-2">${i+1}. ${c}</span>`).join('');
        }

        function resetCode() {
            userSequence = [];
            updateCodeDisplay();
        }

        function runCode() {
            if(userSequence.length === 0) return;
            
            // Simulasi Berhasil
            score += 20;
            document.getElementById('scoreDisplay').textContent = score;
            alert("MasyaAllah! Misi Berhasil!");
            
            currentMisi++;
            
            // Otomatis Simpan Nilai/Skor ke Google Sheets
            syncToGoogleSheets();
        }
    </script>
</body>
</html>
